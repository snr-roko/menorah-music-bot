app = 'menorah-music-bot'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  processes = ['app']
  cpu_kind = 'performance'
  cpus = 1
  memory = '3gb'